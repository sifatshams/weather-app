<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="search">
          <input
            type="text"
            placeholder="Enter city name"
            spellcheck="false"
            id="city"
          />

          <button id="btn">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <div class="weather">
          <div class="img_box">
            <img src="img/clear.png" alt="app" class="weather_icon" />
            <small class="fillWeather">Mist</small>
          </div>
          <h1 class="temp">23°C</h1>
          <h2 class="city">Bangladesh</h2>

          <div class="details">
            <div class="col">
              <img src="img/weather.png" alt="img" />
              <div class="coll2">
                <p class="humidity">50%</p>
                <p>Humidity</p>
              </div>
            </div>
            <div class="col">
              <img src="img/wind.png" alt="img" />
              <div class="coll2">
                <p class="wind">5 Km/h</p>
                <p>Wind Speed</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- js link -->
    <script src="app.js"></script>
  </body>
</html>
